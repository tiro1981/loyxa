<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LUMÉ — kosmetika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud.js"></script>
<style>
:root{
  --accent:#d6017a; --accent-2:#ff3ea5; --accent-soft:#ffe6f3;
  --bg:#ffffff; --soft:#f5f5f8; --card:#ffffff; --ink:#181820; --dim:#8b8b96;
  --line:#ececf1; --shadow:0 8px 26px rgba(20,20,40,.08); --shadow-s:0 3px 12px rgba(20,20,40,.06);
  --radius:18px; --nav-h:78px;
}
:root[data-theme="dark"]{
  --bg:#0f0f14; --soft:#1a1a22; --card:#181820; --ink:#f2f2f6; --dim:#9a9aa6;
  --line:#2a2a34; --accent-soft:#3a1230; --shadow:0 10px 30px rgba(0,0,0,.5); --shadow-s:0 3px 12px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Poppins',system-ui,-apple-system,sans-serif;background:var(--soft);color:var(--ink);
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit}
s{color:var(--dim)}

.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));overflow-x:hidden}

/* ---------- helpers ---------- */
.pad{padding:0 16px}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 16px 12px}
.sec-h h2{margin:0;font-size:22px;font-weight:800;color:var(--accent);letter-spacing:-.4px}
.see-all{font-size:13px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);
  padding:9px 16px;border-radius:22px;box-shadow:var(--shadow-s)}

/* ---------- HERO / HEADER ---------- */
.hero{position:relative;background:linear-gradient(150deg,#2b0e56,#4a0f7a 45%,#12123a);
  border-radius:0 0 26px 26px;overflow:hidden;padding-top:calc(env(safe-area-inset-top,0px))}
.hdr{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);
  display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px;fill:#fff}
.addr{flex:1;min-width:0;display:flex;align-items:center;gap:4px;color:#fff;font-size:13px;font-weight:500}
.addr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr svg{width:15px;height:15px;flex:none;opacity:.9}
.hicons{display:flex;align-items:center;gap:8px}
.hicon{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;position:relative}
.hicon svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2}
.hicon .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}

/* banner slider */
.banner{position:relative;z-index:2;margin-top:2px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
  -ms-overflow-style:none;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:12/5;display:grid;place-items:center}
.slide img{width:100%;height:100%;object-fit:cover}
.banner-empty{aspect-ratio:12/5;display:grid;place-items:center;color:#fff;text-align:center;padding:24px}
.banner-empty b{font-size:20px;font-weight:800;letter-spacing:.5px}
.banner-empty p{margin:6px 0 0;font-size:13px;opacity:.75}
.dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;z-index:3}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:.2s}
.dots i.on{width:18px;border-radius:3px;background:#fff}

/* ---------- category chips (home) ---------- */
.cats{display:flex;gap:16px;overflow-x:auto;padding:4px 16px 8px;-ms-overflow-style:none;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:8px}
.cat-ic{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;font-size:34px;
  box-shadow:var(--shadow-s)}
.cat span{font-size:12px;font-weight:500;text-align:center;line-height:1.2;color:var(--ink)}

/* ---------- product grid + card ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:2px 16px 8px}
.pc{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-s);overflow:hidden;
  display:flex;flex-direction:column;position:relative;cursor:pointer}
.pc-img{position:relative;aspect-ratio:1;background:#fbfbfd;display:grid;place-items:center;padding:10px}
:root[data-theme="dark"] .pc-img{background:#20202a}
.pc-img img,.pc-img svg{width:100%;height:100%;object-fit:contain}
.disc{position:absolute;top:10px;left:10px;background:var(--accent-soft);color:var(--accent);
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;z-index:2}
.fav-b{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;z-index:2}
.fav-b svg{width:19px;height:19px;fill:none;stroke:var(--dim);stroke-width:2}
.fav-b.on svg{fill:var(--accent);stroke:var(--accent)}
.pc-body{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.pc-name{font-size:13.5px;font-weight:500;line-height:1.3;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.pc-meta{font-size:12px;color:var(--dim);margin:6px 0 8px;display:flex;align-items:center;gap:5px}
.pc-meta .star{color:var(--accent)}
.pc-price{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.pc-price .now{font-size:15px;font-weight:700;color:var(--ink);line-height:1.1}
.pc-price .old{font-size:12px;text-decoration:line-through;color:var(--dim);display:block;margin-top:2px}
.add{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;flex:none;
  display:grid;place-items:center;box-shadow:0 5px 14px rgba(214,1,122,.35)}
.add svg{width:20px;height:20px;stroke:#fff;stroke-width:2.4;fill:none}

/* ---------- search ---------- */
.search{display:flex;align-items:center;gap:10px;margin:14px 16px 8px;background:var(--soft);
  border-radius:16px;padding:14px 16px}
.search svg{width:20px;height:20px;stroke:var(--dim);fill:none;stroke-width:2;flex:none}
.search input{border:0;background:none;outline:none;flex:1;font-size:15px;color:var(--ink)}
.search input::placeholder{color:var(--dim)}

.mtiles{columns:2;column-gap:14px;padding:6px 16px}
.mtile{break-inside:avoid;margin-bottom:14px;border-radius:20px;padding:16px 14px;position:relative;overflow:hidden;
  min-height:150px;display:flex;flex-direction:column;cursor:pointer}
.mtile h3{margin:0;font-size:17px;font-weight:600;color:#2a2a33;line-height:1.2;position:relative;z-index:2}
.mtile .emo{margin-top:auto;font-size:52px;text-align:center;line-height:1}
.mtile.tall{min-height:210px}

/* ---------- detail ---------- */
.d-hero{position:relative;background:#fbfbfd;padding:20px 20px 8px}
:root[data-theme="dark"] .d-hero{background:#1c1c25}
.d-img{aspect-ratio:1;display:grid;place-items:center}
.d-img img,.d-img svg{max-height:100%;width:100%;object-fit:contain}
.d-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;display:flex;flex-direction:column;gap:12px;z-index:4}
.d-top .rb{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.d-top .rb svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2}
.d-top .rb.on svg{fill:var(--accent);stroke:var(--accent)}
.d-body{background:var(--bg);border-radius:24px 24px 0 0;margin-top:-18px;position:relative;z-index:3;padding:22px 18px 20px}
.d-title{font-size:23px;font-weight:700;line-height:1.25;margin:0 0 14px;letter-spacing:-.4px}
.d-badge{display:inline-block;background:#181820;color:#fff;font-size:13px;font-weight:600;padding:5px 11px;border-radius:9px;margin-bottom:10px}
:root[data-theme="dark"] .d-badge{background:#33333f}
.d-price{font-size:32px;font-weight:800;letter-spacing:-1px}
.d-old{margin:2px 0 18px;font-size:15px}
.d-old s{margin-right:8px}
.d-old .pct{color:var(--accent);font-weight:600}
.sizes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.size-p{border:1.5px solid var(--accent);color:var(--accent);border-radius:22px;padding:9px 18px;font-size:14px;font-weight:600;background:var(--bg)}
.size-p.on{background:var(--accent);color:#fff}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:0 0 12px;font-size:16px;font-weight:500;color:var(--dim);white-space:nowrap;position:relative}
.tab.on{color:var(--ink);font-weight:600}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;background:var(--accent);border-radius:2px}
.tab-body{font-size:15px;line-height:1.65;color:var(--ink)}
.tab-body.folded{max-height:145px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.read-more{margin-top:10px;font-size:15px;font-weight:500;text-decoration:underline;color:var(--ink)}

.rate{display:flex;align-items:center;gap:16px;margin:26px 0 14px}
.rate .big{font-size:44px;font-weight:800;line-height:1}
.rstars svg{width:22px;height:22px;fill:var(--line);stroke:none}
.rstars svg.f{fill:var(--accent)}
.rate .cnt{margin-left:auto;color:var(--dim);font-size:13px}
.rbars{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
.rbar{display:flex;align-items:center;gap:10px;font-size:14px}
.rbar .n{width:12px;color:var(--ink)}
.rbar svg{width:15px;height:15px;fill:var(--accent)}
.rbar .track{flex:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.rbar .track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rbar .v{width:16px;text-align:right;color:var(--dim)}
.review{border-top:1px solid var(--line);padding:16px 0}
.review .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.review .top b{font-size:15px}
.review .top .dt{color:var(--dim);font-size:13px;margin-left:auto}
.no-rev{color:var(--dim);font-size:14px;padding:16px 0;border-top:1px solid var(--line)}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;
  display:flex;align-items:center;gap:6px;background:var(--card);padding:8px;border-radius:40px;box-shadow:var(--shadow)}
.nav b{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.nav b svg{width:24px;height:24px;stroke:var(--dim);fill:none;stroke-width:2}
.nav b.on{background:radial-gradient(circle at 30% 30%,var(--accent-2),var(--accent))}
.nav b.on svg{stroke:#fff}

/* ---------- sticky detail bar ---------- */
.d-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:45;
  width:min(480px,100%);padding:0 16px;display:flex;align-items:center;gap:12px}
.d-back{width:56px;height:56px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.d-back svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2}
.d-buy{flex:1;height:56px;border-radius:30px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;
  display:grid;place-items:center;box-shadow:0 8px 20px rgba(214,1,122,.4)}

/* ---------- generic back header ---------- */
.bar{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;position:sticky;top:0;background:var(--bg);z-index:20}
.bar .bk{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.bar .bk svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2}
.bar h1{font-size:19px;font-weight:700;margin:0}

/* ---------- cart ---------- */
.crow{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.crow .im{width:74px;height:74px;border-radius:14px;background:#fbfbfd;flex:none;display:grid;place-items:center;padding:6px}
:root[data-theme="dark"] .crow .im{background:#20202a}
.crow .im img,.crow .im svg{width:100%;height:100%;object-fit:contain}
.crow .info{flex:1;min-width:0}
.crow .nm{font-size:14px;font-weight:500;line-height:1.3;margin-bottom:3px}
.crow .pr{font-size:15px;font-weight:700}
.crow .rm{color:var(--dim);font-size:12px}
.qty{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:20px;padding:6px 12px;align-self:center}
.qty button{font-size:18px;font-weight:600;color:var(--accent);width:20px;height:20px;line-height:1}
.qty b{font-size:15px;min-width:16px;text-align:center}
.summary{margin:16px;background:var(--soft);border-radius:18px;padding:16px}
.summary .r{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;color:var(--dim)}
.summary .r.tot{color:var(--ink);font-size:17px;font-weight:700;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.cta{margin:8px 16px 20px;height:56px;border-radius:28px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;
  display:grid;place-items:center;width:calc(100% - 32px);box-shadow:0 8px 20px rgba(214,1,122,.35)}

/* ---------- profile ---------- */
.prof-top{padding:calc(env(safe-area-inset-top,0px) + 26px) 16px 20px;font-size:22px;font-weight:700}
.menu{background:var(--card)}
.mrow{display:flex;align-items:center;gap:16px;padding:17px 18px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.mrow svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;flex:none}
.mrow span{font-size:16px;font-weight:500;flex:1}
.mrow .rt{width:8px;height:8px;border-right:2px solid var(--dim);border-top:2px solid var(--dim);transform:rotate(45deg)}
.mrow.danger svg{stroke:var(--accent)}
.mrow.danger span{color:var(--accent)}
.mgap{height:10px;background:var(--soft)}

/* ---------- orders ---------- */
.order{margin:14px 16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow-s);padding:16px}
.order .ot{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.order .oid{font-size:16px;font-weight:700}
.order .odt{font-size:12px;color:var(--dim);margin-top:2px}
.tag{font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px}
.tag.wait{background:#fff4e0;color:#c77700}
.tag.way{background:var(--accent-soft);color:var(--accent)}
.tag.done{background:#e4f7ea;color:#1c9e4b}
.order .of{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.order .of b{color:var(--ink);font-size:16px}

/* ---------- empty ---------- */
.empty{text-align:center;padding:70px 30px}
.empty .e-ic{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:44px}
.empty h3{font-size:19px;font-weight:700;margin:0 0 8px}
.empty p{color:var(--dim);font-size:14px;line-height:1.5;margin:0 auto;max-width:250px}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(10,10,20,.5);z-index:60;opacity:0;pointer-events:none;transition:.25s;
  display:flex;align-items:flex-end;justify-content:center}
.veil.on{opacity:1;pointer-events:auto}
.sheet{width:min(480px,100%);background:var(--bg);border-radius:24px 24px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:.3s cubic-bezier(.2,.9,.3,1);max-height:88vh;overflow-y:auto}
.veil.on .sheet{transform:translateY(0)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 16px}
.sheet h3{font-size:20px;font-weight:700;margin:0 0 4px}
.sheet .sub{color:var(--dim);font-size:14px;margin:0 0 18px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:7px}
.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:14px;padding:14px 16px;font-size:15px;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--accent)}
.pay-opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:12px}
.pay-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.pay-opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.pay-opt.on .rd{border-color:var(--accent)}
.pay-opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.pay-opt span{font-size:15px;font-weight:500}
.lang-opt{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--line);font-size:16px}
.lang-opt .chk{color:var(--accent);font-weight:700;opacity:0}
.lang-opt.on .chk{opacity:1}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%) translateY(20px);
  background:#181820;color:#fff;padding:12px 22px;border-radius:26px;font-size:14px;font-weight:500;z-index:90;
  opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav"></nav>
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= DATA CONTRACT (admin bilan bir xil) =================
   lume_products : [{id,n,br,c,p,old,sz[],k,img,fit,zoom,pos,d:{uz}}]
   lume_banners  : [{img}]
   lume_orders   : [{id,ts,status,count,total,addr,client,items:[{n,q,p}]}]
   lume_settings : {brand,phone,tg,ship}
======================================================================= */
const CATS = [
  {id:1, name:'Pardoz',   emo:'💄', g:'linear-gradient(160deg,#ffd7ea,#ff9ec8)'},
  {id:2, name:'Kremlar',  emo:'🧴', g:'linear-gradient(160deg,#d6f5e8,#9fe4c8)'},
  {id:3, name:'Parfyum',  emo:'🌸', g:'linear-gradient(160deg,#dfe6ff,#a9c0ff)'},
  {id:4, name:'Fiksator', emo:'💧', g:'linear-gradient(160deg,#e7dcff,#c3a9ff)'},
  {id:5, name:'SPF',      emo:'☀️', g:'linear-gradient(160deg,#fff0cf,#ffd98a)'}
];
const catName = c => (CATS.find(x=>x.id===c)||{}).name || '';

/* ---- i18n (faqat interfeys; mahsulot matni admindan) ---- */
const LANG = {
  uz:{search:"Mahsulotlarni qidirish",cats:"Toifalar",rec:"Tavsiya qilamiz",seeall:"Barchasini ko'rish",
    addr:"Yetkazib berish manzili",addr_set:"Manzilni tanlang",cart:"Savat",cart_e:"Savat bo'sh",
    cart_es:"Yoqqan mahsulotni tanlang — u shu yerda paydo bo'ladi.",fav:"Sevimlilar",fav_e:"Sevimlilar bo'sh",
    fav_es:"Yurakcha bosing — mahsulot shu yerda saqlanadi.",orders:"Buyurtmalar",ord_e:"Buyurtmalar yo'q",

function imgStyle(p){
  const fit=(p&&p.fit==='cover')?'cover':'contain';
  const zoom=(p&&p.zoom)||1;
  const pos=(p&&p.pos)||'50% 50%';
  return `width:100%;height:100%;object-fit:${fit};object-position:${pos};transform:scale(${zoom})`;
}

  if(p&&p.img) return `<img src="${p.img}" alt="" loading="lazy" style="${imgStyle(p)}">`;
  return `<svg viewBox="0 0 80 110" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:70%">

    return `<div class="crow">
      <div class="im">${pic(p)}</div>
      <div class="info">

  const sub = cart.reduce((s,c)=>{const p=pById(c.i);return s+(p?p.p*c.q:0)},0);

  return topbar(t('cart'),true)+rows+
    `<div class="summary">
      <div class="r"><span>${t('items')}</span><b class="num" style="color:var(--ink)">${som(sub)}</b></div>

    <div style="height:20px"></div>`;
}

/* ---- shared top bar ---- */
function topbar(title,back){
  return `<div class="bar">${back?`<button class="bk" onclick="go('home')">${svgN(IC.back)}</button>`:''}<h1>${title}</h1></div>`;
}

/* ================= NAV ================= */
function navHTML(){
  const b=(k,ic)=>`<b class="${view===k?'on':''}" onclick="go('${k}')">${svgN(ic)}</b>`;
  return b('home',IC.home)+b('search',IC.search)+b('fav',IC.heart)+b('profile',IC.user);
}
function paintNav(){ document.getElementById('nav').innerHTML=navHTML();
  document.getElementById('nav').style.display = (view==='detail')?'none':'flex'; }

/* ================= ROUTER ================= */
function go(v){ view=v; searchQ=''; window.scrollTo(0,0); render(); paintNav(); }
function render(keepScroll){
  const app=document.getElementById('app');
  const y = keepScroll ? window.scrollY : 0;
  let html='';
  if(view==='home') html=viewHome();
  else if(view==='search') html=viewSearch();
  else if(view==='detail') html=viewDetail();
  else if(view==='fav') html=viewFav();
  else if(view==='cart') html=viewCart();
  else if(view==='order') html=viewOrders();
  else if(view==='profile') html=viewProfile();
  app.innerHTML=html;
  if(view==='home') startSlider();
  if(keepScroll) window.scrollTo(0,y);
  if(view==='search'){ const inp=document.getElementById('sq'); if(inp&&searchQ){inp.focus();inp.setSelectionRange(searchQ.length,searchQ.length);} }
}

/* ================= BANNER SLIDER ================= */
function startSlider(){
  clearInterval(slideTimer);
  if(banners.length<2) return;
  slideTimer=setInterval(()=>{
    const s=document.getElementById('slides'); if(!s){clearInterval(slideTimer);return;}
    const w=s.clientWidth; let next=Math.round(s.scrollLeft/w)+1;
    if(next>=banners.length) next=0;
    s.scrollTo({left:next*w,behavior:'smooth'});
  },3500);
}
function onSlide(){
  const s=document.getElementById('slides'); const dots=document.getElementById('dots');
  if(!s||!dots) return;
  const i=Math.round(s.scrollLeft/s.clientWidth);
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
}

/* ================= ACTIONS ================= */
function toggleFav(id){ favs.has(id)?favs.delete(id):favs.add(id); saveFavs();
  render(view==='search'||view==='detail'); if(view!=='detail'&&view!=='search') render(); }
function addToCart(id){ const c=cart.find(x=>x.i===id); if(c)c.q++; else cart.push({i:id,q:1});
  saveCart(); toast('«'+((pById(id)||{}).n||t('noname'))+'» '+t('added')); if(view==='home'||view==='search')render(true); paintNavBadge(); }
function chQty(id,d){ const c=cart.find(x=>x.i===id); if(!c)return; c.q+=d; if(c.q<1)cart=cart.filter(x=>x.i!==id); saveCart(); render(); }
function removeCart(id){ cart=cart.filter(x=>x.i!==id); saveCart(); render(); }
function paintNavBadge(){ if(view==='home')render(true); }
function openCat(id){ view='search'; searchQ=''; render();
  // filter grid by category directly
  const app=document.getElementById('app');
  const list=products.filter(p=>p.c===id);
  const c=CATS.find(x=>x.id===id)||{};
  app.innerHTML=topbar(c.name||t('cats'),true)+(list.length?gridHTML(list)
    :`<div class="empty"><div class="e-ic">${c.emo||'🛍️'}</div><h3>${t('emptycat')}</h3></div>`);
  paintNav();
}

/* ---- share / contact ---- */
function shareShop(){
  const url=location.href.split('?')[0]+(window.__LUME_CLIENT&&window.__LUME_CLIENT!=='shop'?('?client='+window.__LUME_CLIENT):'');
  if(navigator.share){ navigator.share({title:SETTINGS.brand,url}).catch(()=>{}); return; }
  try{ navigator.clipboard.writeText(url); toast(t('share')); }catch(e){ toast(url); }
}
function contactShop(){
  const tg=(SETTINGS.tg||'').replace('@','');
  if(tg) window.open('https://t.me/'+tg,'_blank'); else toast(SETTINGS.phone||'—');
}

/* ================= SHEETS ================= */
function openSheet(html){ document.getElementById('sheet').innerHTML='<div class="grab"></div>'+html;
  document.getElementById('veil').classList.add('on'); }
function closeSheet(){ document.getElementById('veil').classList.remove('on'); }
document.getElementById('veil').addEventListener('click',e=>{ if(e.target.id==='veil')closeSheet(); });

function openAddr(){
  openSheet(`<h3>${t('addr_t')}</h3><p class="sub">${lang==='ru'?'Куда доставить заказ?':'Buyurtma qayerga yetkazilsin?'}</p>
    <div class="fld"><label>${t('addr')}</label><input id="ai" value="${esc(addr)}" placeholder="${t('addr_ph')}"></div>
    <div class="fld"><label>${lang==='ru'?'Телефон':'Telefon'}</label><input id="pi" value="${esc(phone)}" placeholder="${t('phone_ph')}" inputmode="tel"></div>
    <button class="cta" style="width:100%;margin:6px 0 0" onclick="saveAddr()">${t('save_addr')}</button>`);
  setTimeout(()=>{const el=document.getElementById('ai');if(el)el.focus();},250);
}
function saveAddr(){
  addr=(document.getElementById('ai').value||'').trim();
  phone=(document.getElementById('pi').value||'').trim();
  try{localStorage.setItem('lume_addr',addr);localStorage.setItem('lume_phone',phone);}catch(e){}
  closeSheet(); render(); paintNav(); toast(t('save_addr'));
}
function openLang(){
  openSheet(`<h3>${t('lang_t')}</h3><div style="margin-top:8px">
    <button class="lang-opt${lang==='uz'?' on':''}" style="width:100%" onclick="setLang('uz')"><span>O‘zbekcha</span><span class="chk">✓</span></button>
    <button class="lang-opt${lang==='ru'?' on':''}" style="width:100%" onclick="setLang('ru')"><span>Русский</span><span class="chk">✓</span></button>
    </div><div style="height:8px"></div>`);
}
function setLang(l){ lang=l; try{localStorage.setItem('lume_lang',l)}catch(e){} closeSheet(); render(); paintNav(); }

function openCheckout(){
  if(!cart.length)return;
  const sub=cart.reduce((s,c)=>{const p=pById(c.i);return s+(p?p.p*c.q:0)},0);
  const total=sub+SHIP();
  openSheet(`<h3>${t('checkout')}</h3><p class="sub">${som(total)} · ${cart.reduce((s,c)=>s+c.q,0)} ${t('items').toLowerCase()}</p>
    <div class="fld"><label>${t('addr')}</label><input id="ci" value="${esc(addr)}" placeholder="${t('addr_ph')}"></div>
    <div class="fld"><label>${lang==='ru'?'Телефон':'Telefon'}</label><input id="cp" value="${esc(phone)}" placeholder="${t('phone_ph')}" inputmode="tel"></div>
    <label style="display:block;font-size:13px;font-weight:600;color:var(--dim);margin:4px 0 8px">${t('p_pay')}</label>
    <button class="pay-opt${payMethod==='cash'?' on':''}" style="width:100%" onclick="setPay('cash')"><span class="rd"></span><span>${t('pay_cash')}</span></button>
    <button class="pay-opt${payMethod==='card'?' on':''}" style="width:100%" onclick="setPay('card')"><span class="rd"></span><span>${t('pay_card')}</span></button>
    <button class="cta" style="width:100%;margin:8px 0 0" onclick="placeOrder()">${t('place')} · ${som(total)}</button>`);
}
function setPay(m){ payMethod=m; openCheckout(); }
function placeOrder(){
  const a=(document.getElementById('ci').value||'').trim();
  const ph=(document.getElementById('cp').value||'').trim();
  if(!a){ toast(t('need_addr')); return; }
  addr=a; phone=ph;
  try{localStorage.setItem('lume_addr',addr);localStorage.setItem('lume_phone',phone);}catch(e){}
  const sub=cart.reduce((s,c)=>{const p=pById(c.i);return s+(p?p.p*c.q:0)},0);
  const total=sub+SHIP();
  const n=cart.reduce((s,c)=>s+c.q,0);
  const order={
    id:'#'+Math.floor(1050+Math.random()*8900),
    ts:Date.now(), status:'wait', count:n, total,
    addr:addr, phone:ph, pay:payMethod,
    client:window.__LUME_CLIENT||'shop',
    items:cart.map(c=>{const p=pById(c.i);return{n:p?p.n:'',q:c.q,p:p?p.p:0}})
  };
  try{
    const list=cget('lume_orders',[])||[];
    list.unshift(order);
    cset('lume_orders',list);
  }catch(e){}
  cart=[]; saveCart(); closeSheet(); toast(t('ord_ok')); go('order');
}

/* ================= TOAST ================= */
let tt; function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),1900); }

/* ================= HYDRATE ================= */
function hydrate(){
  try{
    const cp=cget('lume_products',null);
    if(Array.isArray(cp)) products=cp.map((p,i)=>Object.assign({id:p.id||i+1},p));
    const cs=cget('lume_settings',null);
    if(cs&&typeof cs==='object') SETTINGS=Object.assign(SETTINGS,cs);
    const cb=cget('lume_banners',null);
    banners=Array.isArray(cb)?cb.filter(b=>b&&b.img):[];
    // yo'q bo'lib qolgan mahsulotlarni savat/sevimlidan tozalash
    cart=cart.filter(c=>pById(c.i)); saveCart();
    favs=new Set([...favs].filter(id=>pById(id))); saveFavs();
  }catch(e){ console.error('[lume] hydrate:',e); }
}

/* ================= BOOT ================= */
(async () => {
  loadLocal();
  const _urlClient=new URLSearchParams(location.search).get('client');
  if(_urlClient){ try{localStorage.setItem('lume_last_client',_urlClient)}catch(e){} }
  const CLIENT_ID=_urlClient
    || (function(){ try{return JSON.parse(localStorage.getItem('bo_session')||'{}').clientId}catch(e){return null} })()
    || (function(){ try{return localStorage.getItem('lume_last_client')}catch(e){return null} })()
    || 'shop';
  window.__LUME_CLIENT=CLIENT_ID;
  try{ await Cloud.init('lume',CLIENT_ID); }catch(e){ console.error('[boot] Cloud.init:',e); }
  hydrate(); render(); paintNav();
  window.addEventListener('cloud:updated',()=>{
    try{ hydrate(); render(view!=='home'); paintNav(); }catch(e){ console.error('[lume] cloud:updated:',e); }
  });
})();
</script>
