<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1B120D" />
  <title>Kofe Kafe · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>" />
  <link rel="stylesheet" href="admin.css?v=1" />
</head>
<body>
  <div class="layout">
    <aside class="side" id="side">
      <div class="brand">
        <span class="brand-mark">☕</span>
        <div><b id="brandName">Kofe Kafe</b><small>Admin panel</small></div>
        <button class="side-close" id="sideClose" aria-label="Menyuni yopish">×</button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot"><span class="dot" id="syncDot"></span><span id="syncText">Ulanmoqda…</span></div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="head">
        <button class="ib menu-btn" id="menuBtn" aria-label="Menyu">☰</button>
        <div class="head-t"><h1 id="pageTitle">Buyurtmalar</h1><small id="pageSub"></small></div>
        <div class="head-r" id="headActions"></div>
      </header>
      <section id="page"></section>
    </main>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box" id="modalBox"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../cloud.js?v=1"></script>
  <script>
    // Boot: AVVAL Cloud.init (kafe ma'lumoti), keyin admin skriptlari
    (async () => {
      const CLIENT_ID = new URLSearchParams(location.search).get("client")
        || (function () { try { return JSON.parse(localStorage.getItem("bo_session") || "{}").clientId; } catch (e) { return null; } })()
        || "demo";
      window.__CLIENT_ID = CLIENT_ID;
      try { await Cloud.init("kofe", CLIENT_ID); } catch (e) { console.error("[boot] Cloud.init:", e); }
      for (const src of ["../js/data.js", "../telegram.js", "admin.js"]) {
        await new Promise((res, rej) => { const s = document.createElement("script"); s.src = src + "?v=1"; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
      }
    })();
  </script>
</body>
</html>
