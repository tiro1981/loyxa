<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1B120D" />
  <title>Kofe Kafe — Menyu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>" />
  <link rel="stylesheet" href="css/style.css?v=1" />
  <!-- Telegram Mini App: to'liq ekran va ko'rinadigan balandlik (--tg-vh) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg || !tg.platform || tg.platform === 'unknown') return;
      var root = document.documentElement;
      root.classList.add('in-tg');
      function setVh() { root.style.setProperty('--tg-vh', (tg.viewportStableHeight || window.innerHeight) + 'px'); }
      setVh();
      tg.onEvent('viewportChanged', setVh);
      tg.ready();
      tg.expand();
      try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app">
    <main id="view"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Asosiy menyu"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud.js?v=1"></script>
  <script>
    // Boot: AVVAL Cloud.init (kafe ma'lumoti), keyin ilova skriptlari
    (async () => {
      const CLIENT_ID = new URLSearchParams(location.search).get("client")
        || (function () { try { return JSON.parse(localStorage.getItem("bo_session") || "{}").clientId; } catch (e) { return null; } })()
        || "demo";
      window.__CLIENT_ID = CLIENT_ID;
      try { await Cloud.init("kofe", CLIENT_ID); } catch (e) { console.error("[boot] Cloud.init:", e); }
      for (const src of ["js/data.js", "telegram.js", "js/app.js"]) {
        await new Promise((res, rej) => { const s = document.createElement("script"); s.src = src + "?v=1"; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
      }
    })();
  </script>
</body>
</html>
